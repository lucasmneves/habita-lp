    <style>
      #site-loader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #0b2c22; color: #f5f7ef; font-family: Arial, sans-serif; text-align: center; transition: opacity .35s ease, visibility .35s ease; }
      #site-loader.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      .site-loader-content { display: grid; justify-items: center; gap: 24px; padding: 32px; }
      .site-loader-mark { position: relative; width: 64px; height: 64px; border: 2px solid rgba(214, 248, 135, .25); border-radius: 50%; animation: loader-pulse 1.8s ease-in-out infinite; }
      .site-loader-mark::before, .site-loader-mark::after { content: ''; position: absolute; bottom: 19px; left: 29px; width: 14px; height: 27px; border-radius: 100% 0 100% 0; background: #d5fa8a; transform-origin: bottom center; transform: rotate(-42deg); }
      .site-loader-mark::after { transform: rotate(48deg) scaleX(-1); }
      .site-loader-name { font-size: 34px; font-weight: 800; letter-spacing: -.06em; line-height: 1; }
      .site-loader-label { margin: 0; color: #d5e5d8; font-size: 13px; letter-spacing: .08em; }
      @keyframes loader-pulse { 50% { transform: scale(1.08); border-color: rgba(214, 248, 135, .65); } }
      @media (prefers-reduced-motion: reduce) { #site-loader { transition: none; } .site-loader-mark { animation: none; } }
    </style>
