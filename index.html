      #site-loader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #0b2c22; color: #f5f7ef; font-family: Inter, Arial, sans-serif; text-align: center; transition: opacity .35s ease, visibility .35s ease; }

.site-loader-art{position:relative;width:clamp(90px,19vw,130px);aspect-ratio:1}
.site-loader-art img{display:block;width:100%;height:100%;clip-path:ellipse(34% 33% at 50% 52%)}
.site-loader-ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform:rotate(-90deg)}
.site-loader-track{fill:none;stroke:#216555;stroke-width:4}
.site-loader-arc{fill:none;stroke:#c0fc60;stroke-width:4;stroke-linecap:round;stroke-dasharray:65 199;transform-origin:50% 50%;filter:drop-shadow(0 0 4px #a7ef5380);animation:loader-orbit 1.8s linear infinite}
.site-loader-label{letter-spacing:0;line-height:1.7}
@keyframes loader-orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#site-loader{transition:none}.site-loader-arc{animation:none}}
